<line class="base" x1="272" y1="120" x2="272" y2="166" stroke-width="1"/>
<path class="s1" d="M273,123 h142.00 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-142.00 z"/>
<text class="ink2" x="425.00" y="136" font-size="12.5">8.8</text>
<path class="s2" d="M273,145 h4.30 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-4.30 z"/>
<text class="ink2" x="287.30" y="158" font-size="12.5">0.5</text>
<text class="ink" x="518" y="110" font-size="13" font-weight="600">Segments not at 0/45/90°</text>
<line class="base" x1="519" y1="120" x2="519" y2="166" stroke-width="1"/>
