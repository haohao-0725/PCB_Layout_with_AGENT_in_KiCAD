<text class="ink2" x="252" y="74.5" font-size="12.5">Restructured board (bottom bar)</text>
<text class="ink" x="24" y="110" font-size="13" font-weight="600">Segments per mm of track</text>
<line class="base" x1="25" y1="120" x2="25" y2="166" stroke-width="1"/>
<path class="s1" d="M26,123 h142.00 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-142.00 z"/>
<text class="ink2" x="178.00" y="136" font-size="12.5">1.00</text>
<path class="s2" d="M26,145 h9.14 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-9.14 z"/>
<text class="ink2" x="45.14" y="158" font-size="12.5">0.09</text>
