<line class="base" x1="519" y1="226" x2="519" y2="272" stroke-width="1"/>
<path class="s1" d="M520,229 h142.00 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-142.00 z"/>
<text class="ink2" x="672.00" y="242" font-size="12.5">3</text>
<text class="ink2" x="526.00" y="264" font-size="12.5">0</text>
