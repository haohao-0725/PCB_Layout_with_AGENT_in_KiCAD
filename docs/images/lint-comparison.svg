<svg xmlns="http://www.w3.org/2000/svg" width="760" height="292" viewBox="0 0 760 292" role="img" aria-labelledby="t d">
<title id="t">Tidiness lint: autorouted draft vs restructured board</title>
<desc id="d">Segments per mm of track: autorouted 1.00, restructured 0.09; Turns per 10 mm (zigzag): autorouted 8.8, restructured 0.5; Segments not at 0/45/90°: autorouted 79, restructured 0; Short S-bend jogs: autorouted 7,222, restructured 11; Vias on power / phase nets: autorouted 24, restructured 0; Copper pours not on GND: autorouted 3, restructured 0</desc>
<style>
  .surface { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .base { stroke: #c3c2b7; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .base { stroke: #383835; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; }
  }
</style>
<rect class="surface" x="0" y="0" width="760" height="292" rx="8"/>
<text class="ink" x="24" y="32" font-size="17" font-weight="600">Tidiness lint, preset T: same carrier board, two layouts</text>
<text class="ink2" x="24" y="52" font-size="12.5">Lower is tidier. Each panel has its own scale. Measured by kcp lint on the board files.</text>
<rect class="s1" x="24" y="64" width="12" height="12" rx="2"/>
<text class="ink2" x="42" y="74.5" font-size="12.5">Autorouted draft (top bar)</text>
